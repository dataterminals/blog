<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  {%- include head.html -%}
</head>
<body>
  {%- include background.html -%}
  {%- include header.html -%}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {%- include footer.html -%}

  {%- assign v = site.time | date: '%s' -%}
  <script src="{{ '/assets/js/bg.js' | relative_url }}?v={{ v }}"></script>
  <!-- tip.js owns the shared hover readout; shelf.js binds to it. -->
  <script src="{{ '/assets/js/tip.js' | relative_url }}?v={{ v }}"></script>
  <script src="{{ '/assets/js/shelf.js' | relative_url }}?v={{ v }}"></script>
</body>
</html>
