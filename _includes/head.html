<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">

<!-- The hub's terracotta dot, inline so the tab icon costs no request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d8794c'/%3E%3C/svg%3E">

<!-- Replay the theme before the first paint, so a reader who picked one — here
     or on the hub — doesn't watch the default palette flash past. The two sites
     share an origin, and so a localStorage, so the choice follows a reader from
     one to the other. Inline and blocking on purpose: a file would land too late.

     Any stored name is replayed rather than checked against a list, because a
     list here would have to learn every theme the hub adds. One with no palette
     in house.css just falls back to the default until theme.js corrects it. -->
<script>
  try {
    var t = localStorage.getItem('dt:theme');
    if (t && /^[a-z]+$/.test(t)) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>

{%- assign hub = site.home_url | default: 'https://dataterminals.github.io/' -%}
{%- assign v = site.time | date: '%s' %}
<!-- house.css comes straight off the hub: the six palettes, the background
     layers, the theme switch and the post prose, so this site can't drift from
     that one. blog.css, after it, is only what's this site's own.

     Pages serves everything with a ten-minute max-age you can't change, so a
     returning visitor can hold fresh HTML against stale CSS. The hub solves this
     with content hashes; here the build time does the same job for free, since
     Jekyll rewrites every page on every deploy anyway. The cost is that an
     unchanged stylesheet is still re-fetched after a deploy — one small file.
     house.css is the hub's and carries no stamp from here: its own ten minutes
     are the most it can lag behind the hub. -->
<link rel="stylesheet" href="{{ hub }}house.css">
<link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}?v={{ v }}">
